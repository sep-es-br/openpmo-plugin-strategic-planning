plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.github.sep-es-br'
version = '1.0.0'

sourceCompatibility = '11'
targetCompatibility = '11'

tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux:2.2.12.RELEASE'
    implementation 'com.github.sep-es-br:openpmo-plugin-strategic-planning-interface:1.0.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test:2.2.12.RELEASE'
}

test {
    useJUnitPlatform()
    jvmArgs '-Dfile.encoding=UTF-8'
    testLogging { events 'passed', 'skipped', 'failed' }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'openpmo-plugin-strategic-planning'
            from components.java
        }
    }
}